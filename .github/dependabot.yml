version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # local-board has no runtime dependencies today, but this keeps any future
  # devDependencies (and the engines floor) under watch.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
