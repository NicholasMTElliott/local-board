name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm run check
      - run: npm test
      - run: npm run validate

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Required so action-gh-release can create the GitHub release for the tag.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
