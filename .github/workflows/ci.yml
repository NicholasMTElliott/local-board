name: CI

on:
  push:
    branches: [mainline]
  pull_request:

permissions:
  contents: read

# Pushes run CI only on mainline; other branches get CI through their PR, so a
# PR commit is tested once. A new commit on a PR cancels that PR's in-progress
# run. On mainline a new run queues instead of cancelling the one in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    # Every supported Node line on Linux; Windows and macOS on the active LTS
    # only. Node-version bugs are platform-independent and surface on Linux;
    # Windows and macOS are here for path, line-ending and shell differences,
    # which one Node line catches. Five jobs instead of nine keeps the slow
    # Windows/macOS runners to one each.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['22.x', '24.x', '26.x']
        include:
          - os: windows-latest
            node-version: '24.x'
          - os: macos-latest
            node-version: '24.x'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # No dependencies and no lockfile — nothing to install. Run the checks directly.
      - run: npm run check
      - run: npm test
      - run: npm run validate
