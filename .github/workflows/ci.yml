name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A same-repo PR branch triggers both `push` and `pull_request`. Group both by
# head repo + branch so they share one slot and the newer run cancels the older.
# On mainline a new run queues instead of cancelling the one in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/mainline' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      # No dependencies and no lockfile — nothing to install. Run the checks directly.
      - run: npm run check
      - run: npm test
      - run: npm run validate
